name: marl_env

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11.13
  - pip=25.2

  # Reinforcement Learning / ML
  - pytorch=2.8.0
  - gymnasium=1.0.0
  - stable-baselines3=2.7.0
  - numpy=1.26.4
  - scipy=1.16.1
  - scikit-learn=1.7.1
  - statsmodels=0.14.5

  # Data / mathematics
  - pandas=2.3.1
  - networkx=3.5
  - sympy=1.14.0

  # Visualization
  - matplotlib=3.10.5
  - seaborn=0.13.2
  - pillow=11.3.0

  # RL / utilities
  - absl-py=2.3.1
  - cloudpickle=3.1.1
  - farama-notifications=0.0.4
  - filelock=3.19.1
  - fsspec=2025.7.0
  - joblib=1.5.1
  - packaging=25.0
  - platformdirs=4.3.7
  - psutil=5.9.0
  - tabulate=0.9.0
  - tqdm=4.67.1
  - typing-extensions=4.14.1
  - pyyaml
  - rich

  # Jupyter / development
  - ipykernel=6.29.5
  - ipython=9.1.0
  - ipywidgets
  - jupyter_client=8.6.3
  - jupyter_core=5.8.1

  # TensorBoard
  - tensorboard=2.20.0

  # Networking / serialization
  - grpcio=1.74.1
  - protobuf=6.31.1

  # Build tools
  - setuptools=80.9.0
  - wheel=0.45.1

  - pip:
      - opencv-python==4.12.0.88
      - sb3-contrib==2.7.0